<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="style.css">

    <title>Weather App</title>

</head>


<body>
    
    <!-- WEATHER EFFECTS -->
<div id="weatherEffects"></div>

    <!-- ==========================================
         MAIN WEATHER APP
         ========================================== -->

    <div class="weather-app">


        <!-- ==========================================
             HEADER
             ========================================== -->

        <header class="header">

            <h1>Weather App</h1>

            <p>
                Check the weather anywhere in the world
            </p>

        </header>



        <!-- ==========================================
             SEARCH SECTION
             ========================================== -->

            <section class="search-section">

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name"
                >

                <button id="searchButton">
                    Search
                </button>

                <button
                    id="locationButton"
                    type="button"
                >
                    📍 My Location
                </button>

            </section>



        <!-- ==========================================
             CURRENT WEATHER
             ========================================== -->

        <section class="current-weather">

            <div class="location">

                <h2 id="cityName">
                    Durban
                </h2>

                <p id="date">
                    Tuesday, 22 September 2026
                </p>

            </div>


            <div class="weather-main">

                <!-- WEATHER ICON -->

                <div
                    class="weather-icon"
                    id="weatherIcon"
                >
                    ☀️
                </div>


                <!-- TEMPERATURE -->

                <div class="temperature">

                    <span id="temperature">
                        24
                    </span>

                    °C

                </div>


                <!-- WEATHER CONDITION -->

                <div
                    class="condition"
                    id="condition"
                >
                    Sunny
                </div>

            </div>


            <!-- LAST UPDATED -->

            <p
                id="lastUpdated"
                class="last-updated"
            >
                Last updated: --
            </p>

        </section>



        <!-- ==========================================
             WEATHER DETAILS
             ========================================== -->

        <section class="weather-details">


            <!-- FEELS LIKE -->

            <div class="weather-card">

                <h3>
                    Feels Like
                </h3>

                <p id="feelsLike">
                    25°C
                </p>

            </div>



            <!-- HUMIDITY -->

            <div class="weather-card">

                <h3>
                    Humidity
                </h3>

                <p id="humidity">
                    65%
                </p>

            </div>



            <!-- WIND -->

            <div class="weather-card">

                <h3>
                    Wind
                </h3>

                <p id="windSpeed">
                    18 km/h
                </p>

            </div>



            <!-- PRESSURE -->

            <div class="weather-card">

                <h3>
                    Pressure
                </h3>

                <p id="pressure">
                    1015 hPa
                </p>

            </div>

        </section>



        <!-- ==========================================
             5-DAY FORECAST
             ========================================== -->

        <section class="forecast-section">

            <h2>
                5-Day Forecast
            </h2>


            <!--
                JavaScript will create the
                real forecast cards here.
            -->

            <div
                class="forecast-container"
            >

            </div>

        </section>



        <!-- ==========================================
             FOOTER
             ========================================== -->

        <footer class="footer">

            <p>
                Weather App &copy; 2026
            </p>

        </footer>


    </div>



    <!-- ==========================================
         JAVASCRIPT
         ========================================== -->

    <script src="script.js"></script>

</body>

</html>
